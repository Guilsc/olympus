<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="olympus-title olympus-desc">
  <title id="olympus-title">One governance model, six domains</title>
  <desc id="olympus-desc">The governor role returns proceed, stop, or clarify. Only proceed names the orchestrator as conceptual next owner; no runtime invocation is implied. The orchestrator contract routes outcomes to six domain owners: professional delivery, personal life, research and learning, systems and automation, creative media, and experimentation. Humans retain approval authority. Tools and credentials belong to the chosen host.</desc>
  <defs>
    <marker id="olympus-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#bcc6d3"/>
    </marker>
    <marker id="olympus-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#c9aa72"/>
    </marker>
  </defs>
  <rect width="960" height="610" rx="12" fill="#101722"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <path d="M480 230 V284" fill="none" stroke="#bcc6d3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#olympus-arrow)"/>
    <rect x="394.1" y="244" width="171.79999999999998" height="25" rx="3" fill="#101722"/>
    <text x="480" y="262" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">proceed: next_owner</text>
    <path d="M480 368 V410 H90 M480 410 H870" fill="none" stroke="#bcc6d3" stroke-width="1.8"/>
    <path d="M90 410 V450" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#olympus-arrow)"/>
    <path d="M246 410 V450" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#olympus-arrow)"/>
    <path d="M402 410 V450" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#olympus-arrow)"/>
    <path d="M558 410 V450" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#olympus-arrow)"/>
    <path d="M714 410 V450" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#olympus-arrow)"/>
    <path d="M870 410 V450" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#olympus-arrow)"/>
    <text x="36" y="40" font-size="12" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="1.8">OLYMPUS</text>
    <text x="36" y="80" font-size="29" fill="#f3f1e9" text-anchor="start" font-weight="600" letter-spacing="0">One governance model, six domains</text>
    <text x="36" y="110" font-size="17" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="0">Role contracts and bounded handoffs—not an autonomous runtime</text>
    <g data-node-id="governor">
      <rect data-role="bounds" x="330" y="146" width="300" height="84" rx="9" fill="#1a2636" stroke="#c9aa72" stroke-width="2"/>
      <text x="480.0" y="177" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Governor role</text>
      <text x="480.0" y="204" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Governance decision</text>
    </g>
    <g data-node-id="orchestrator">
      <rect data-role="bounds" x="330" y="284" width="300" height="84" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="480.0" y="315" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Orchestrator</text>
      <text x="480.0" y="342" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Routing + handoff contracts</text>
    </g>
    <g data-node-id="domain-0">
      <rect data-role="bounds" x="16" y="450" width="148" height="92" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="90.0" y="481" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Delivery</text>
      <text x="90.0" y="508" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Professional</text>
    </g>
    <g data-node-id="domain-1">
      <rect data-role="bounds" x="172" y="450" width="148" height="92" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="246.0" y="481" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Personal</text>
      <text x="246.0" y="508" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">life</text>
    </g>
    <g data-node-id="domain-2">
      <rect data-role="bounds" x="328" y="450" width="148" height="92" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="402.0" y="481" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Research</text>
      <text x="402.0" y="508" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">+ learning</text>
    </g>
    <g data-node-id="domain-3">
      <rect data-role="bounds" x="484" y="450" width="148" height="92" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="558.0" y="481" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Systems</text>
      <text x="558.0" y="508" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">+ automation</text>
    </g>
    <g data-node-id="domain-4">
      <rect data-role="bounds" x="640" y="450" width="148" height="92" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="714.0" y="481" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Creative</text>
      <text x="714.0" y="508" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">media</text>
    </g>
    <g data-node-id="domain-5">
      <rect data-role="bounds" x="796" y="450" width="148" height="92" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="870.0" y="481" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Experiment</text>
      <text x="870.0" y="508" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Experimentation</text>
    </g>
    <text x="36" y="582" font-size="15" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="0">Conceptual routing only. Human authority and host execution permissions remain explicit.</text>
  </g>
</svg>
