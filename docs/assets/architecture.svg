<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="olympus-title olympus-desc" id="architecture-root"><title id="olympus-title">Olympus | Governed ownership</title><desc id="olympus-desc">DECLARATIVE RESPONSIBILITY MODEL. OFFLINE REPOSITORY INTEGRITY. Governor: Admits, clarifies, or stops scope. Orchestrator: Ownership, readiness, and handoffs. Domain Owner: Accountable bounded outcome. Role and Domain contracts: Canonical identifiers and aliases. Integrity checks: Identity, links, theme, and JSON. Reviewable check results: Not proof of live model execution. Architectural foundation, not a deployed agent runtime. Human approval remains a separate boundary.</desc>
